<body>

<div class="container form-page">
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${course.id == null ? 'Create Course' : 'Edit Course'}">Create Course</title>
    <link rel="stylesheet" th:href="@{/css/course.css}">
</head>

    <div class="page-header">
        <div>
            <p class="eyebrow">Course catalogue</p>
            <h1 th:text="${course.id == null ? 'Create Course' : 'Edit Course'}">Create Course</h1>
            <p class="page-subtitle">Add the course details, media and learner information.</p>
        </div>
        <a th:href="@{/courses}" class="btn btn-secondary">Back to courses</a>
    </div>

    <div class="form-card">

    <p th:if="${param.error != null}" class="form-error">
        Course Name and Course Title are required.
    </p>

    <form th:action="@{/courses/save}"
          method="post"
          enctype="multipart/form-data"
          class="course-form">

        <div class="form-group">

            <label>Course Name</label>

            <input type="text"
                   name="name"
                     th:value="${course.name}"
                   class="form-control"
                   placeholder="Java Full Stack"
                   required>

        </div>


        <div class="form-group">

            <label>Course Title</label>

            <input type="text"
                   name="title"
                     th:value="${course.title}"
                   class="form-control"
                   placeholder="Java Full Stack Developer Course"
                   required>

        </div>


        <div class="form-group">

            <label>Slug</label>

            <input type="text"
                   name="slug"
                     th:value="${course.slug}"
                   class="form-control"
                     placeholder="java-full-stack"
                     required>

        </div>


        <div class="form-group">

            <label>Short Description</label>

            <textarea name="shortDescription"
                      class="form-control"
                      th:text="${course.shortDescription}"></textarea>

        </div>


        <div class="form-group">

            <label>Description</label>

            <textarea name="description"
                      class="form-control"
                      th:text="${course.description}"></textarea>

        </div>


        <div class="form-group">

            <label>Highlights JSON</label>

            <textarea name="highlights"
                      class="form-control"
                      th:text="${course.highlights}"
                      placeholder='["Industry Ready","Live Projects","Placement Support"]'></textarea>

        </div>


        <div class="form-group">

            <label>Course Curriculum JSON</label>

            <textarea name="courseCurriculum"
                      class="form-control"
                      rows="10"
                      th:text="${course.courseCurriculum}"
                      placeholder='[
  {
    "title": "Java Basics",
    "topics": ["Variables", "OOP"]
  }
]'></textarea>

        </div>


        <div class="form-group">

            <label>Fee</label>

            <input type="number"
                   name="fee"
                     th:value="${course.fee}"
                   step="0.01"
                   class="form-control">

        </div>


        <div class="form-group">

            <label>Duration</label>

            <input type="text"
                   name="duration"
                     th:value="${course.duration}"
                   class="form-control"
                   placeholder="6 Months">

        </div>


        <div class="form-group">

            <label>Banner Image</label>

            <input type="file"
                     name="bannerFile"
                   class="form-control file-input"
                   accept="image/*">

        </div>


        <div class="form-group">

            <label>Card Image</label>

            <input type="file"
                     name="cardFile"
                   class="form-control file-input"
                   accept="image/*">

        </div>


        <div class="form-group">

            <label>Course PDF</label>

            <input type="file"
                   name="coursePdf"
                   class="form-control file-input"
                   accept="application/pdf">

        </div>


        <div class="form-group checkbox-group">

            <input type="checkbox"
                   name="isFeatured"
                     value="true"
                     th:checked="${course.isFeatured}">

            <label>Featured Course</label>

        </div>


        <button type="submit" class="btn btn-primary">

            <span th:text="${course.id == null ? 'Save Course' : 'Update Course'}">Save Course</span>

        </button>

    </form>
    </div>

</div>

</body>


</html>

<script>
    const titleInput = document.querySelector('input[name="title"]');
    const slugInput = document.querySelector('input[name="slug"]');
    let slugModified = Boolean(slugInput.value);

    slugInput.addEventListener('input', () => {
        slugModified = true;
    });

    titleInput.addEventListener('input', () => {
        if (!slugModified) {
            slugInput.value = titleInput.value
                .toLowerCase()
                .trim()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-|-$/g, '');
        }
    });
</script>
